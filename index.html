<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Deployment with HTML</HTML></title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            text-align: center;
            padding-top: 100px;
        }
        .container {
            background: white;
            width: 70%;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #24292f;
        }
        p {
            color: #555;
            font-size: 18px;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Pratyush!</h1>
        <p>
            This application is deployed automatically.
        </p>
        <p class="success">
            Deployment Successful!
        </p>
    </div>
</body>
</html>
